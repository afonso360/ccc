[workspace]
members = [
    "crates/ccc-abi",
    "crates/ccc-codegen",
    "crates/ccc-diag",
    "crates/ccc-driver",
    "crates/ccc-ir",
    "crates/ccc-link",
    "crates/ccc-pp",
    "crates/ccc-sema",
    "crates/ccc-session",
    "crates/ccc-syntax",
    "crates/ccc-target",
    "crates/ccc-types",
]
default-members = ["crates/ccc-driver"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
cranelift-codegen = { version = "=0.132.0", default-features = false, features = ["std", "unwind", "x86", "arm64", "riscv64"] }
cranelift-frontend = { version = "=0.132.0", default-features = false, features = ["std"] }
cranelift-module = { version = "=0.132.0" }
cranelift-object = { version = "=0.132.0" }
gimli = { version = "=0.33.0", default-features = false, features = ["read", "write"] }
object = { version = "=0.39.0", default-features = false, features = ["read", "write"] }
rustc_apfloat = { version = "=0.2.3", default-features = false }
sha2 = { version = "=0.10.2" }
signal-hook = { version = "=0.4.4" }
target-lexicon = { version = "=0.13.5" }
