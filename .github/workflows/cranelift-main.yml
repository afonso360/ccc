name: Cranelift main compatibility

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-main:
    name: Test current upstream head (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            packages: >-
              binutils build-essential clang coreutils gdb libc-bin procps
            rust_target: ""
            qemu: false
            oracle: x86_64-linux
            ccc_bin: target/debug/ccc
            target_cc: gcc
          - name: Linux AArch64
            runner: ubuntu-24.04-arm
            packages: >-
              binutils binutils-aarch64-linux-gnu build-essential clang
              coreutils gdb gcc-aarch64-linux-gnu libc-bin procps
            rust_target: ""
            qemu: false
            oracle: aarch64-linux
            ccc_bin: target/debug/ccc
            target_cc: gcc
          - name: Linux RISC-V64 under QEMU
            runner: ubuntu-24.04
            packages: >-
              binutils-riscv64-linux-gnu build-essential coreutils
              gcc-riscv64-linux-gnu gdb-multiarch libc-bin
              libc6-dev-riscv64-cross procps qemu-user qemu-user-binfmt
            rust_target: riscv64gc-unknown-linux-gnu
            qemu: true
            oracle: riscv64-linux
            ccc_bin: target/riscv64gc-unknown-linux-gnu/debug/ccc
            target_cc: riscv64-linux-gnu-gcc
          - name: macOS AArch64
            runner: macos-26
            packages: ""
            rust_target: ""
            qemu: false
            oracle: darwin-arm64
            ccc_bin: target/debug/ccc
            target_cc: /usr/bin/cc
    env:
      CCC_CC: ${{ matrix.target_cc }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.packages }}

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cross-compilation target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Configure RISC-V QEMU
        if: matrix.qemu
        run: |
          echo 'CARGO_BUILD_TARGET=riscv64gc-unknown-linux-gnu' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER=qemu-riscv64 -L /usr/riscv64-linux-gnu' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_DEV_OPT_LEVEL=2' >> "$GITHUB_ENV"
          echo 'QEMU_LD_PREFIX=/usr/riscv64-linux-gnu' >> "$GITHUB_ENV"

      - name: Verify RISC-V QEMU
        if: matrix.qemu
        run: |
          sudo systemctl restart systemd-binfmt.service
          grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-riscv64
          printf '%s\n' 'int main(void) { return 0; }' > "$RUNNER_TEMP/qemu-smoke.c"
          riscv64-linux-gnu-gcc "$RUNNER_TEMP/qemu-smoke.c" -o "$RUNNER_TEMP/qemu-smoke"
          "$RUNNER_TEMP/qemu-smoke"

      - name: Refresh the candidate lockfile and provenance
        run: |
          cargo update -p cranelift-codegen
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          lockfile = Path("Cargo.lock").read_text()
          revisions = set(
              re.findall(
                  r'source = "git\+https://github\.com/bytecodealliance/'
                  r'wasmtime\.git\?branch=main#([0-9a-f]{40})"',
                  lockfile,
              )
          )
          if len(revisions) != 1:
              raise SystemExit(
                  f"expected one Wasmtime main revision, found {sorted(revisions)}"
              )

          revision = revisions.pop()
          Path(os.environ["RUNNER_TEMP"], "cranelift-main-revision.txt").write_text(
              revision + "\n"
          )
          digest_path = Path("crates/ccc-abi/src/digest.rs")
          digest = digest_path.read_text()
          digest, replacements = re.subn(
              r'const CRANELIFT_BACKEND_REVISION: &str = "[0-9a-f]{40}";',
              f'const CRANELIFT_BACKEND_REVISION: &str = "{revision}";',
              digest,
          )
          if replacements != 1:
              raise SystemExit("could not update the backend provenance constant")
          digest_path.write_text(digest)
          PY
          cargo fmt --all --check
          git diff -- Cargo.lock crates/ccc-abi/src/digest.rs \
            > "$RUNNER_TEMP/cranelift-main-candidate.patch"

      - name: Capture the candidate dependency graph
        run: >-
          cargo tree
          --locked
          --workspace
          --edges normal,build,dev
          > "$RUNNER_TEMP/cranelift-main-cargo-tree.txt"

      - name: Verify the candidate dependency graph
        run: cargo test -p ccc-abi cranelift_packages_use_the_audited_backend_revision

      - name: Test the workspace
        run: cargo test --workspace --all-targets

      - name: Check structural codegen benchmark axes
        run: >-
          benchmarks/codegen/run.py
          --ccc "${{ github.workspace }}/${{ matrix.ccc_bin }}"
          --output
          "$RUNNER_TEMP/ccc-benchmark-smoke-${{ matrix.oracle }}/codegen"
          --cases block-count,ssa-values,live-globals,string-literals
          --profiles O0,O2,Oz
          --block-scales 0,2
          --value-scales 0,2
          --global-scales 0,2
          --string-scales 0,2
          --warmups 0
          --samples 1

      - name: Check kernel object benchmarks
        run: >-
          benchmarks/kernels/run.py
          --ccc "${{ github.workspace }}/${{ matrix.ccc_bin }}"
          --output
          "$RUNNER_TEMP/ccc-benchmark-smoke-${{ matrix.oracle }}/kernels"
          --mode object
          --cases
          direct-call,integer-loop,floating-loop,branch-switch,memory-traffic,aggregate-copy,tls-access,atomic-rmw,variadic-call
          --profiles O0,O2,Oz
          --compile-warmups 0
          --compile-samples 1

      - name: Run the target oracle
        env:
          CCC_BIN: ${{ github.workspace }}/${{ matrix.ccc_bin }}
          CCC_REQUIRE_TARGET_ORACLE: "1"
          CCC_TARGET_ORACLE_ARTIFACTS: ${{ runner.temp }}/ccc-target-oracle-${{ matrix.oracle }}
        run: tests/target-oracle/run.sh ${{ matrix.oracle }}

      - name: Upload the candidate, oracle, and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cranelift-main-candidate-${{ matrix.oracle }}
          path: |
            ${{ runner.temp }}/cranelift-main-candidate.patch
            ${{ runner.temp }}/cranelift-main-revision.txt
            ${{ runner.temp }}/cranelift-main-cargo-tree.txt
            ${{ runner.temp }}/ccc-target-oracle-${{ matrix.oracle }}
            ${{ runner.temp }}/ccc-benchmark-smoke-${{ matrix.oracle }}
          if-no-files-found: ignore
