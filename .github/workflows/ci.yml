name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Fast quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install shell analysis
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check shell scripts
        run: |
          git ls-files -z -- '*.sh' | xargs -0 -n 1 bash -n
          # Profile fragments deliberately define variables consumed by the
          # scripts that source them, which ShellCheck cannot infer through
          # dynamically resolved source paths.
          git ls-files -z -- '*.sh' |
            xargs -0 shellcheck --severity=warning --exclude=SC2034,SC2154

      - name: Check Markdown links
        run: python3 .github/scripts/check-markdown-links.py

      - name: Check whitespace
        run: python3 .github/scripts/check-whitespace.py

      - name: Test codegen benchmark harness
        run: benchmarks/codegen/test-run.sh

      - name: Test executable kernel benchmark harness
        run: benchmarks/kernels/test-run.sh

  test:
    name: Rust tests (${{ matrix.name }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            packages: >-
              binutils build-essential clang coreutils gdb libc-bin procps
            rust_target: ""
            qemu: false
            oracle: x86_64-linux
            ccc_bin: target/debug/ccc
            target_cc: gcc
          - name: Linux AArch64
            runner: ubuntu-24.04-arm
            packages: >-
              binutils binutils-aarch64-linux-gnu build-essential clang
              coreutils gdb gcc-aarch64-linux-gnu libc-bin procps
            rust_target: ""
            qemu: false
            oracle: aarch64-linux
            ccc_bin: target/debug/ccc
            target_cc: gcc
          - name: Linux RISC-V64 under QEMU
            runner: ubuntu-24.04
            packages: >-
              binutils-riscv64-linux-gnu build-essential coreutils
              gcc-riscv64-linux-gnu gdb-multiarch libc-bin
              libc6-dev-riscv64-cross procps qemu-user qemu-user-binfmt
            rust_target: riscv64gc-unknown-linux-gnu
            qemu: true
            oracle: riscv64-linux
            ccc_bin: target/riscv64gc-unknown-linux-gnu/debug/ccc
            target_cc: riscv64-linux-gnu-gcc
          - name: macOS AArch64
            runner: macos-26
            packages: ""
            rust_target: ""
            qemu: false
            oracle: darwin-arm64
            ccc_bin: target/debug/ccc
            target_cc: /usr/bin/cc
    env:
      CCC_CC: ${{ matrix.target_cc }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.packages }}

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cross-compilation target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Configure RISC-V QEMU
        if: matrix.qemu
        run: |
          echo 'CARGO_BUILD_TARGET=riscv64gc-unknown-linux-gnu' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER=qemu-riscv64 -L /usr/riscv64-linux-gnu' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_DEV_OPT_LEVEL=2' >> "$GITHUB_ENV"
          echo 'QEMU_LD_PREFIX=/usr/riscv64-linux-gnu' >> "$GITHUB_ENV"

      - name: Verify RISC-V QEMU
        if: matrix.qemu
        run: |
          sudo systemctl restart systemd-binfmt.service
          grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-riscv64
          printf '%s\n' 'int main(void) { return 0; }' > "$RUNNER_TEMP/qemu-smoke.c"
          riscv64-linux-gnu-gcc "$RUNNER_TEMP/qemu-smoke.c" -o "$RUNNER_TEMP/qemu-smoke"
          "$RUNNER_TEMP/qemu-smoke"

      - name: Run Rust test suite
        run: cargo test --locked --workspace --all-targets

      - name: Check structural and declaration codegen benchmark axes
        run: >-
          benchmarks/codegen/run.py
          --ccc "${{ github.workspace }}/${{ matrix.ccc_bin }}"
          --output
          "$RUNNER_TEMP/ccc-benchmark-smoke-${{ matrix.oracle }}/codegen"
          --cases
          declarations-per-function,block-count,ssa-values,live-globals,string-literals
          --profiles O0,O2,Oz
          --declarations-per-function-scales 0,2
          --block-scales 0,2
          --value-scales 0,2
          --global-scales 0,2
          --string-scales 0,2
          --warmups 0
          --samples 1

      - name: Check kernel object benchmarks
        run: >-
          benchmarks/kernels/run.py
          --ccc "${{ github.workspace }}/${{ matrix.ccc_bin }}"
          --output
          "$RUNNER_TEMP/ccc-benchmark-smoke-${{ matrix.oracle }}/kernels"
          --mode object
          --cases
          direct-call,integer-loop,floating-loop,branch-switch,memory-traffic,aggregate-copy,tls-access,atomic-rmw,variadic-call
          --profiles O0,O2,Oz
          --compile-warmups 0
          --compile-samples 1

      - name: Upload object benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-benchmarks-${{ matrix.oracle }}
          path: ${{ runner.temp }}/ccc-benchmark-smoke-${{ matrix.oracle }}
          if-no-files-found: ignore

      - name: Check hosted stdio codegen equivalence
        run: >-
          benchmarks/codegen/run.py
          --ccc "${{ github.workspace }}/${{ matrix.ccc_bin }}"
          --output
          "$RUNNER_TEMP/ccc-hosted-header-${{ matrix.oracle }}"
          --cases hosted-header,hosted-printf --profiles O0,O2,Oz
          --warmups 0 --samples 1

      - name: Upload hosted stdio codegen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-stdio-codegen-${{ matrix.oracle }}
          path: ${{ runner.temp }}/ccc-hosted-header-${{ matrix.oracle }}
          if-no-files-found: ignore

      - name: Run target oracle
        env:
          CCC_BIN: ${{ github.workspace }}/${{ matrix.ccc_bin }}
          CCC_REQUIRE_TARGET_ORACLE: "1"
          CCC_TARGET_ORACLE_ARTIFACTS: ${{ runner.temp }}/ccc-target-oracle-${{ matrix.oracle }}
        run: tests/target-oracle/run.sh ${{ matrix.oracle }}

      - name: Upload target-oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-oracle-${{ matrix.oracle }}
          path: ${{ runner.temp }}/ccc-target-oracle-${{ matrix.oracle }}
          if-no-files-found: ignore

  bzip2-targets:
    name: bzip2 corpus (${{ matrix.name }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AArch64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            packages: >-
              binutils-aarch64-linux-gnu build-essential curl
              gcc-aarch64-linux-gnu git libc6-dev-arm64-cross make openssl
              qemu-user
            qemu_root: /usr/aarch64-linux-gnu
          - name: Linux RISC-V64
            runner: ubuntu-24.04
            target: riscv64-unknown-linux-gnu
            packages: >-
              binutils-riscv64-linux-gnu build-essential curl
              gcc-riscv64-linux-gnu git libc6-dev-riscv64-cross make openssl
              qemu-user
            qemu_root: /usr/riscv64-linux-gnu
          - name: macOS AArch64
            runner: macos-26
            target: aarch64-apple-darwin
            packages: coreutils openssl@3
            qemu_root: ""
    env:
      CCC: ${{ github.workspace }}/target/debug/ccc

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.packages }}

      - name: Install Darwin dependencies
        if: runner.os == 'macOS'
        run: brew install ${{ matrix.packages }}

      - name: Configure target execution tools
        if: runner.os == 'Linux'
        run: echo 'BZIP2_QEMU_ROOT=${{ matrix.qemu_root }}' >> "$GITHUB_ENV"

      - name: Configure Darwin checksum tools
        if: runner.os == 'macOS'
        run: |
          echo "BZIP2_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
          echo "BZIP2_MD5SUM=$(command -v gmd5sum)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Build CCC
        run: cargo build --locked -p ccc-driver

      - name: Test bzip2
        run: >-
          test-corpus/bzip2/run.sh --target ${{ matrix.target }}
          --work-dir "$RUNNER_TEMP/ccc-corpus/bzip2-${{ matrix.target }}"

      - name: Upload bzip2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bzip2-${{ matrix.target }}
          path: ${{ runner.temp }}/ccc-corpus/bzip2-${{ matrix.target }}
          if-no-files-found: ignore

  corpus:
    name: Test corpus (Linux x86-64)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCC: ${{ github.workspace }}/target/debug/ccc

    steps:
      - uses: actions/checkout@v6

      - name: Install corpus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils clang coreutils curl diffutils file findutils g++ gcc gdb \
            git make openssl patch pkg-config tar tcl-dev unzip zlib1g-dev

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Build CCC
        run: cargo build --locked -p ccc-driver

      - name: Test corpus adapters
        run: ./test-corpus/test-adapters.sh

      - name: Test Lua
        run: test-corpus/lua/run.sh --work-dir "$RUNNER_TEMP/ccc-corpus/lua"

      - name: Test SQLite
        run: >-
          test-corpus/sqlite/run.sh --suite veryquick
          --work-dir "$RUNNER_TEMP/ccc-corpus/sqlite"

      - name: Test bzip2
        run: >-
          test-corpus/bzip2/run.sh --target x86_64-unknown-linux-gnu
          --work-dir "$RUNNER_TEMP/ccc-corpus/bzip2"

      - name: Test zlib
        run: test-corpus/zlib/run.sh --work-dir "$RUNNER_TEMP/ccc-corpus/zlib"

      - name: Test Redis
        run: test-corpus/redis/run.sh --work-dir "$RUNNER_TEMP/ccc-corpus/redis"

      - name: Test zstd
        run: test-corpus/zstd/run.sh --work-dir "$RUNNER_TEMP/ccc-corpus/zstd"

      - name: Build release CCC for codegen measurements
        run: cargo build --locked --release -p ccc-driver

      - name: Run codegen microbenchmarks
        run: >-
          benchmarks/codegen/run.py
          --ccc "${{ github.workspace }}/target/release/ccc"
          --output "$RUNNER_TEMP/ccc-corpus/codegen-benchmarks"
          --profiles O0,O2,Oz --warmups 0 --samples 1
          --declaration-scales 0,256,1024
          --data-declaration-scales 0,256,1024
          --function-scales 8,32,128

      - name: Upload codegen microbenchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegen-microbenchmarks-linux-x86-64
          path: ${{ runner.temp }}/ccc-corpus/codegen-benchmarks
          if-no-files-found: ignore

      - name: Run C-Ray correctness benchmark
        run: >-
          test-corpus/c-ray/run.sh --profile correctness
          --work-dir "$RUNNER_TEMP/ccc-corpus/c-ray"

      - name: Upload C-Ray benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-ray-correctness-linux-x86-64
          path: ${{ runner.temp }}/ccc-corpus/c-ray
          if-no-files-found: ignore
