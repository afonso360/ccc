name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CCC_REQUIRE_SYSV_ABI_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install native ABI and corpus prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils clang coreutils curl diffutils file findutils g++ gcc gdb \
            git make openssl patch pkg-config tar tcl-dev unzip zlib1g-dev
      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ccc-sysv-amd64-artifacts"
          mkdir -p "$artifact_dir"
          missing=()
          for tool in ar awk basename cat chmod cmp cp curl cc dd diff dirname file find \
              gcc clang git grep id ln make md5sum mkdir mkfifo mktemp mv nm ranlib \
              tclsh pkg-config objdump readelf gdb objcopy openssl patch rm sed \
              sha256sum sort stat tail tar tee timeout touch tr uname unzip wc; do
            if ! command -v "$tool" >/dev/null; then
              missing+=("$tool")
            fi
          done
          if command -v pkg-config >/dev/null; then
            for module in tcl zlib; do
              if ! pkg-config --exists "$module"; then
                missing+=("pkg-config:$module")
              fi
            done
          fi
          if (( ${#missing[@]} )); then
            printf -v missing_list '%s, ' "${missing[@]}"
            missing_list=${missing_list%, }
            printf '::error::Missing runner prerequisites: %s\n' "$missing_list" \
              | tee "$artifact_dir/runner-prerequisites.txt"
            exit 1
          fi
          printf 'All runner prerequisites are available.\n' \
            > "$artifact_dir/runner-prerequisites.txt"
      - name: Verify pinned ABI and arithmetic-oracle sources
        run: |
          mkdir -p "$RUNNER_TEMP/ccc-sysv-amd64-artifacts"
          curl --fail --silent --show-error --location --retry 3 \
            https://gitlab.com/x86-psABIs/x86-64-ABI/-/raw/e1ce098331da5dbd66e1ffc74162380bcc213236/x86-64-ABI/low-level-sys-info.tex \
            --output "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/x86-64-low-level-sys-info.tex"
          echo "2d42f2ab76b99a3b8456e6bc07e18314e85991119f72db90ca1175328e27b705  $RUNNER_TEMP/ccc-sysv-amd64-artifacts/x86-64-low-level-sys-info.tex" | sha256sum --check --strict
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/ARM-software/abi-aa/daa7a94ca55973736c0e434a67a6e4bbcd35d7fa/aapcs64/aapcs64.rst \
            --output "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/aapcs64.rst"
          echo "92460d0e8a1e081e0b1ed8f23dd6f9a0716ca566158a3e099a48de62cb2125a6  $RUNNER_TEMP/ccc-sysv-amd64-artifacts/aapcs64.rst" | sha256sum --check --strict
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/riscv-non-isa/riscv-elf-psabi-doc/e03d44ae2f0e1144f9498c2896b5ae25b0449398/riscv-cc.adoc \
            --output "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/riscv-cc.adoc"
          echo "c87c97d518681c44398add931cc41a43235abe656eaf831b849934a3919d86e5  $RUNNER_TEMP/ccc-sysv-amd64-artifacts/riscv-cc.adoc" | sha256sum --check --strict
          curl --fail --silent --show-error --location --retry 3 \
            https://www.jhauser.us/arithmetic/SoftFloat-3e.zip \
            --output "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/SoftFloat-3e.zip"
          echo "21130ce885d35c1fe73fc1e1bf2244178167e05c6747cad5f450cc991714c746  $RUNNER_TEMP/ccc-sysv-amd64-artifacts/SoftFloat-3e.zip" | sha256sum --check --strict
          curl --fail --silent --show-error --location --retry 3 \
            https://www.jhauser.us/arithmetic/TestFloat-3e.zip \
            --output "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/TestFloat-3e.zip"
          echo "6d4bdf0096b48a653aa59fc203a9e5fe18b5a58d7a1b715107c7146776a0aad6  $RUNNER_TEMP/ccc-sysv-amd64-artifacts/TestFloat-3e.zip" | sha256sum --check --strict
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - name: Record native ABI and corpus tool identities
        run: |
          mkdir -p "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/tmp"
          {
            rustc --version --verbose
            cargo --version
            gcc --version
            gcc -dumpmachine
            clang --version
            clang --print-target-triple
            objdump --version
            readelf --version
            gdb --version
            objcopy --version
            make --version
            pkg-config --modversion tcl
            pkg-config --modversion zlib
            printf 'puts [info patchlevel]\n' | tclsh
          } 2>&1 | tee "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/tool-identities.txt"
      - run: cargo fmt --check
      - name: Test corpus adapters
        run: ./test-corpus/test-adapters.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p ccc-driver --test preprocessing -- --show-output
      - run: cargo test -p ccc-driver --features ci-sysv-amd64 --test sysv_amd64_environment -- --show-output
        env:
          TMPDIR: ${{ runner.temp }}/ccc-sysv-amd64-artifacts/tmp
      - run: cargo test -p ccc-driver --features ci-sysv-amd64 --test abi_oracle -- --show-output
        env:
          TMPDIR: ${{ runner.temp }}/ccc-sysv-amd64-artifacts/tmp
      - run: cargo test -p ccc-driver --features ci-sysv-amd64 --test sysv_amd64_interop -- --show-output
        env:
          TMPDIR: ${{ runner.temp }}/ccc-sysv-amd64-artifacts/tmp
      - name: Run native x86-64 target oracle
        env:
          CCC_REQUIRE_TARGET_ORACLE: "1"
          CCC_TARGET_ORACLE_ARTIFACTS: ${{ runner.temp }}/ccc-sysv-amd64-artifacts/target-oracle
        run: |
          cargo build --locked -p ccc-driver
          tests/target-oracle/run.sh x86_64-linux
      - name: Run independent extF80 arithmetic oracle
        env:
          CCC_REQUIRE_TESTFLOAT_ORACLE: "1"
          CCC_SOFTFLOAT_ARCHIVE: ${{ runner.temp }}/ccc-sysv-amd64-artifacts/SoftFloat-3e.zip
          CCC_TESTFLOAT_ARCHIVE: ${{ runner.temp }}/ccc-sysv-amd64-artifacts/TestFloat-3e.zip
          CCC_TESTFLOAT_ARTIFACTS: ${{ runner.temp }}/ccc-sysv-amd64-artifacts/testfloat-oracle
        run: |
          if CCC_SOFTFLOAT_ARCHIVE=/definitely/missing/SoftFloat-3e.zip \
               CCC_TESTFLOAT_ARCHIVE=/definitely/missing/TestFloat-3e.zip \
               CCC_TESTFLOAT_ARTIFACTS="$RUNNER_TEMP/testfloat-fail-closed" \
               tests/target-oracle/run-testfloat.sh; then
            echo "extF80 oracle masked missing pinned archives" >&2
            exit 1
          fi
          tests/target-oracle/run-testfloat.sh
      - name: Build and test Lua with CCC
        env:
          CCC: target/debug/ccc
        run: |
          test-corpus/lua/run.sh \
            --work-dir "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/lua"
      - name: Build and run SQLite veryquick with CCC
        env:
          CCC: target/debug/ccc
        run: |
          test-corpus/sqlite/run.sh \
            --suite veryquick \
            --work-dir "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/sqlite"
      - name: Build and test bzip2 with CCC
        env:
          CCC: target/debug/ccc
        run: |
          test-corpus/bzip2/run.sh \
            --target x86_64-unknown-linux-gnu \
            --work-dir "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/bzip2"
      - name: Build and test zlib with CCC
        env:
          CCC: target/debug/ccc
        run: |
          test-corpus/zlib/run.sh \
            --work-dir "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/zlib"
      - name: Build and smoke-test Redis with CCC
        env:
          CCC: target/debug/ccc
        run: |
          test-corpus/redis/run.sh \
            --work-dir "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/redis"
      - name: Build and test zstd with CCC
        env:
          CCC: target/debug/ccc
        run: |
          test-corpus/zstd/run.sh \
            --work-dir "$RUNNER_TEMP/ccc-sysv-amd64-artifacts/zstd"
      - run: cargo test --workspace --all-targets
      - name: Retain native ABI failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sysv-amd64-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ccc-sysv-amd64-artifacts
          if-no-files-found: error

  target-oracle-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-linux
            triple: aarch64-unknown-linux-gnu
            driver: aarch64-linux-gnu-gcc
            objcopy: aarch64-linux-gnu-objcopy
            archiver: aarch64-linux-gnu-ar
            ranlib: aarch64-linux-gnu-ranlib
            readelf: aarch64-linux-gnu-readelf
            qemu: qemu-aarch64
            qemu_root: /usr/aarch64-linux-gnu
          - name: riscv64-linux
            triple: riscv64-unknown-linux-gnu
            driver: riscv64-linux-gnu-gcc
            objcopy: riscv64-linux-gnu-objcopy
            archiver: riscv64-linux-gnu-ar
            ranlib: riscv64-linux-gnu-ranlib
            readelf: riscv64-linux-gnu-readelf
            qemu: qemu-riscv64
            qemu_root: /usr/riscv64-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned cross-target environment
        run: |
          command -v docker >/dev/null || {
            echo "Docker is required for pinned cross-target evidence" >&2
            exit 1
          }
          docker build \
            --file .github/target-oracle-linux.Dockerfile \
            --tag ccc-target-oracle-linux:${{ github.sha }} \
            .
      - name: Run cross-target ABI, header, debugger, and corpus evidence
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ccc-target-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --volume "$ARTIFACT_DIR:/artifacts" \
            --workdir /workspace \
            --env HOME=/tmp/ccc-home \
            --env CARGO_HOME=/tmp/ccc-cargo \
            --env CCC_REQUIRE_TARGET_ORACLE=1 \
            --env CCC_TARGET_ORACLE_ARTIFACTS=/artifacts/oracle \
            --env CCC_OBJCOPY=${{ matrix.objcopy }} \
            --env CCC_QEMU_ROOT=${{ matrix.qemu_root }} \
            --env CCC_LINK_CC=${{ matrix.driver }} \
            --env BZIP2_AR=${{ matrix.archiver }} \
            --env BZIP2_RANLIB=${{ matrix.ranlib }} \
            --env BZIP2_READELF=${{ matrix.readelf }} \
            --env BZIP2_QEMU=${{ matrix.qemu }} \
            --env BZIP2_QEMU_ROOT=${{ matrix.qemu_root }} \
            ccc-target-oracle-linux:${{ github.sha }} \
            bash -c '
              set -euo pipefail
              mkdir -p "$HOME" "$CARGO_HOME"
              cargo build --locked -p ccc-driver
              if CCC_BIN=/definitely/missing/ccc \
                   CCC_TARGET_ORACLE_ARTIFACTS=/tmp/fail-closed-probe \
                   tests/target-oracle/run.sh aarch64-linux; then
                echo "target oracle masked a prerequisite failure" >&2
                exit 1
              fi
              tests/target-oracle/run.sh "${{ matrix.name }}"
              CCC=target/debug/ccc \
                test-corpus/bzip2/run.sh \
                --target "${{ matrix.triple }}" \
                --work-dir /artifacts/bzip2
            '
      - name: Retain cross-target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.name }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ccc-target-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  target-oracle-darwin-arm64:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Verify pinned Darwin ABI source and toolchain identity
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ccc-target-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          for tool in curl file lldb nm otool shasum xcrun; do
            command -v "$tool" >/dev/null || {
              echo "missing required Darwin tool: $tool" >&2
              exit 1
            }
          done
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          "$openssl_bin" dgst -sha3-256 /dev/null >/dev/null
          clt_version=$(pkgutil --pkg-info=com.apple.pkg.CLTools_Executables | awk '/^version:/ { print $2 }')
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          compiler_target=$(/usr/bin/cc -dumpmachine)
          [[ "$clt_version" == 26.6.0.0.1.1781586589 || "$clt_version" == 26.6.0.0.1781586589 ]]
          [[ "$sdk_version" == 26.5 ]]
          [[ "$(/usr/bin/cc --version | head -n 1)" == "Apple clang version 21.0.0 (clang-2100.1.1.101)" ]]
          [[ "$compiler_target" == arm64-apple-darwin25.* ]]
          grep -Fq 'developer_tools = "Command Line Tools 26.6.0.0.1781586589"' docs/spec-sources/darwin-arm64.toml
          grep -Fq 'sdk = "macOS 26.5"' docs/spec-sources/darwin-arm64.toml
          grep -Fq 'compiler = "Apple clang 21.0.0 (clang-2100.1.1.101)"' docs/spec-sources/darwin-arm64.toml
          grep -Fq 'compiler_host_target_family = "arm64-apple-darwin25.*"' docs/spec-sources/darwin-arm64.toml
          grep -Fq 'compiler_reference_target = "arm64-apple-macos11"' docs/spec-sources/darwin-arm64.toml
          curl --fail --silent --show-error --location --retry 3 \
            https://docs.developer.apple.com/tutorials/data/documentation/xcode/writing-arm64-code-for-apple-platforms.md \
            --output "$ARTIFACT_DIR/writing-arm64-code-for-apple-platforms.md"
          echo "afe0badf53abe5510e610358ba81050080692af7df7715a44be55271904d3b3e  $ARTIFACT_DIR/writing-arm64-code-for-apple-platforms.md" \
            | shasum -a 256 --check
          {
            echo "clt=$clt_version"
            echo "sdk=$sdk_version"
            echo "target=$compiler_target"
            /usr/bin/cc --version
            xcrun ld -version_details
            /usr/bin/nmedit --version || true
            lldb --version
          } > "$ARTIFACT_DIR/pinned-tool-identities.txt" 2>&1
      - name: Run native Darwin ABI, header, debugger, and corpus evidence
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ccc-target-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cargo build --locked -p ccc-driver
          if CCC_REQUIRE_TARGET_ORACLE=1 \
               CCC_BIN=/definitely/missing/ccc \
               CCC_TARGET_ORACLE_ARTIFACTS="$ARTIFACT_DIR/fail-closed-probe" \
               tests/target-oracle/run.sh darwin-arm64; then
            echo "target oracle masked a prerequisite failure" >&2
            exit 1
          fi
          CCC_REQUIRE_TARGET_ORACLE=1 \
            CCC_NMEDIT=/usr/bin/nmedit \
            CCC_TARGET_ORACLE_ARTIFACTS="$ARTIFACT_DIR/oracle" \
            tests/target-oracle/run.sh darwin-arm64
          CCC=target/debug/ccc \
            CCC_NMEDIT=/usr/bin/nmedit \
            CCC_LINK_CC=/usr/bin/cc \
            BZIP2_OPENSSL="$(brew --prefix openssl@3)/bin/openssl" \
            BZIP2_MD5SUM="$PWD/test-corpus/bzip2/md5sum-darwin" \
            BZIP2_SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            BZIP2_DEPLOYMENT_TARGET=11.0 \
            test-corpus/bzip2/run.sh \
            --target aarch64-apple-darwin \
            --work-dir "$ARTIFACT_DIR/bzip2"
      - name: Retain Darwin target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-darwin-arm64-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ccc-target-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
