archive_c_translation_units = 13
build_translation_units = 9
native_link_commands = 2
target_compiler = "ccc"
link_driver = "gcc"
link_mode = "platform-default-pie-executable"

upstream_test_target = "check"
upstream_test_command = "make -j1 check"
upstream_reference_comparisons = 6
extended_test_command = "run-tests.sh --bzip2=<built-bzip2> --without-valgrind"
extended_success_marker = "All tests passed"
smoke_command = "bzip2 -9 -c INPUT; bzip2 -t STREAM; bzip2 -d -c STREAM; cmp INPUT OUTPUT"

