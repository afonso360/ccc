[target_applicability."x86_64-unknown-linux-gnu"]
status = "applicable"
evidence_kind = "execution"
runner = "run.sh"
reason = "The native runner verifies a little-endian x86-64 Linux GNU host, builds unmodified C-Ray with CCC, links through the audited native driver, and compares every image with a strict-FP native GCC reference."

[target_applicability."aarch64-unknown-linux-gnu"]
status = "inapplicable"
reason = "The benchmark has no pinned native AArch64 Linux runner or cross-run timing contract; emulated execution would be correctness evidence but not comparable performance evidence."

[target_applicability."riscv64-unknown-linux-gnu"]
status = "inapplicable"
reason = "The benchmark has no pinned native RISC-V Linux runner or cross-run timing contract; emulated execution would be correctness evidence but not comparable performance evidence."

[target_applicability."aarch64-apple-darwin"]
status = "applicable"
evidence_kind = "execution"
runner = "run.sh"
reason = "The native runner verifies an Apple-silicon macOS host, builds unmodified C-Ray with CCC using the active SDK, links through Apple Clang, and compares every image with a strict-FP Apple Clang reference."
