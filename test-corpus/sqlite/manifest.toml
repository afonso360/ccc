target = "x86_64-unknown-linux-gnu"
language_mode = "gnu11"
gnu_compatibility_tuple = "4.2.1"
build_interface = "classic-autoconf-make"
configure_entrypoint = "./configure"
build_target = "testfixture"
testfixture_translation_units = 91
fuzzcheck_translation_units = 9
fuzzcheck_support_translation_units = 8
default_test_suite = "veryquick"
supported_test_suites = ["veryquick", "quick", "all", "full"]
build_compiler = "gcc"
target_compiler = "ccc"
link_driver = "gcc"
link_mode = "non-pie-executable"
configure_arguments = [
    "--disable-shared",
    "--disable-readline",
    "--disable-load-extension",
]
configure_environment = ["LDFLAGS=-no-pie"]
required_tools = [
    "awk",
    "bash",
    "basename",
    "cat",
    "cmp",
    "cp",
    "dirname",
    "find",
    "gcc",
    "grep",
