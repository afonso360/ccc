    "readelf",
    "rm",
    "sed",
    "sort",
    "tclsh",
    "tee",
    "tr",
    "unzip",
    "wc",
]
conditional_download_tools = ["curl"]
required_development_packages = ["tcl", "zlib"]
requires_non_root_user = true
requires_native_linux_filesystem = true

pin_rationales = [
    "Release 3.47.0 removed SQLite's remaining long double use by switching that calculation to Dekker's algorithm.",
    "Release 3.47.2 is the final canonical-source release before the configure and Makefile interface migrated from Autoconf to Autosetup in 3.48.0.",
    "The hosted math wrapper preserves libc declarations while supplying a compiler-compatible binary64 isnan macro, allowing configure to detect the interface without a cache override.",
]

[expected_inventory]
selected_builtins = ["__sync_synchronize"]
available_hosted_builtins = ["__builtin_inff", "__builtin_nanf"]
suite_consumers_of_hosted_float_builtins = ["all", "full"]
unselected_builtin_families = [
    "__atomic_load_n-and-__atomic_store_n",
    "__builtin_bswap",
    "__builtin_overflow",
    "__builtin_clz",
]
inline_assembly_forms = []
wide_integer_uses = []
variable_length_array_objects = []
statement_expressions = []
computed_gotos = []

[default_and_tcl_configuration_gates]
macros = [
    "VDBE_PROFILE",
    "SQLITE_PERFORMANCE_TRACE",
    "SQLITE_ENABLE_STMT_SCANSTATUS",
]
rationale = "These macros are inactive for testfixture and the Tcl suites, excluding src/hwtime.h and its rdtsc inline assembly from that surface. The full suite's fuzzcheck profile enables SQLITE_ENABLE_STMT_SCANSTATUS under the scoped hwtime predicate override below."

[fuzzcheck_capability_adjustment]
component = "fuzzcheck generated sqlite3.c translation"
language_mode = "gnu11"
preprocessor_override = "__STRICT_ANSI__=1"
upstream_feature_macro = "SQLITE_ENABLE_STMT_SCANSTATUS"
timing_backend = "upstream-no-assembly-zero-fallback"
additional_effect = "SQLITE_INLINE is disabled in the amalgamation"
unmodified_components = ["alltest", "fuzzcheck support translation units", "sessionfuzz"]
rationale = "SQLite's checked fuzzcheck profile enables statement scan status, which selects rdtsc inline assembly in the generated amalgamation under the advertised GNU x86-64 identity. Defining SQLite's __STRICT_ANSI__ predicate for that one sqlite3.c translation selects src/hwtime.h's upstream no-assembly timing fallback without changing source, removing fuzz inputs, disabling feature macros, or exposing strict-mode parsing to GNU system headers. In this release the predicate's only other SQLite effect is suppressing the SQLITE_INLINE optimization hint."

[test_suites.veryquick]
driver = "make-target"
make_target = "tcltest"
primary_tcl_entrypoint = "test/veryquick.test"
components = ["tcltest"]
command = "make -j1 tcltest"

[test_suites.quick]
driver = "test-script"
make_target = "testfixture"
primary_tcl_entrypoint = "test/quick.test"
components = ["quick"]
command = "make -j1 testfixture && ./testfixture \"$TOP/test/quick.test\" --verbose=file --output=test-out.txt"
rationale = "SQLite's quicktest Make target runs the smaller test/extraquick.test script, so the adapter invokes the upstream test/quick.test entrypoint directly."

[test_suites.all]
driver = "make-target"
make_target = "alltest"
primary_tcl_entrypoint = "test/all.test"
components = ["alltest"]
required_hosted_builtins = ["__builtin_inff", "__builtin_nanf"]
command = "make -j1 alltest"

[test_suites.full]
driver = "make-target"
make_target = "fulltest"
primary_tcl_entrypoint = "test/all.test"
components = ["alltest", "fuzztest"]
required_hosted_builtins = ["__builtin_inff", "__builtin_nanf"]
command = "make -j1 fulltest"

