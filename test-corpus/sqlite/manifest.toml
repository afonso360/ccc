gnu_compatibility_tuple = "4.2.1"
build_interface = "classic-autoconf-make"
configure_entrypoint = "./configure"
build_target = "testfixture"
test_command = "make veryquick"
build_compiler = "gcc"
target_compiler = "ccc"
configure_arguments = [
    "--disable-shared",
    "--disable-readline",
    "--disable-load-extension",
]
required_tools = ["gcc", "clang", "make", "pkg-config", "tclsh"]
required_development_packages = ["tcl", "zlib"]

pin_rationales = [
    "Release 3.47.0 removed SQLite's remaining long double use by switching that calculation to Dekker's algorithm.",
    "Release 3.47.2 is the final canonical-source release before the configure and Makefile interface migrated from Autoconf to Autosetup in 3.48.0.",
]

[expected_inventory]
selected_builtins = ["__sync_synchronize"]
unselected_builtin_families = [
    "__atomic_load_n-and-__atomic_store_n",
    "__builtin_bswap",
    "__builtin_overflow",
    "__builtin_clz",
]
inline_assembly_forms = []
wide_integer_uses = []
variable_length_array_objects = []
statement_expressions = []
computed_gotos = []

[inactive_configuration_gates]
macros = [
    "VDBE_PROFILE",
    "SQLITE_PERFORMANCE_TRACE",
    "SQLITE_ENABLE_STMT_SCANSTATUS",
]
rationale = "Keeping these macros inactive excludes src/hwtime.h and its rdtsc inline assembly from the pinned testfixture surface."

[adapter_artifacts]
retain = [
    "config.log",
    "effective-macros.txt",
    "predicate-probe.txt",
    "compile-commands.txt",
    "capability-inventory.txt",
    "test-out.txt",
]
