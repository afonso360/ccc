test_adjustment_rationale = "SQLite 3.47.2 leaves the truncated recovercorrupt4.test input at test.db2; recoverfault.test reuses that path and its fault loop becomes order-dependent, including under GCC. Removing the stale output once restores the test's intended initial state without omitting any test."
