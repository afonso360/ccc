[target_applicability."x86_64-unknown-linux-gnu"]
status = "applicable"
evidence_kind = "execution"
runner = "run.sh"
reason = "The adapter audits the unmodified x86-64 source surface, CCC translations, x87 f80 bridges, selected inline assembly, native GCC links, ELF PIE artifacts, and the focused server/CLI execution profile."

[target_applicability."aarch64-unknown-linux-gnu"]
status = "inapplicable"
reason = "The adapter requires a native x86-64 GCC driver and its pinned builtin and inline-assembly inventory have not been recertified for AArch64 or QEMU execution."

[target_applicability."riscv64-unknown-linux-gnu"]
status = "inapplicable"
reason = "The adapter requires a native x86-64 GCC driver and its pinned builtin and inline-assembly inventory have not been recertified for RISC-V or QEMU execution."

[target_applicability."aarch64-apple-darwin"]
status = "inapplicable"
reason = "The selected profile requires Linux process, filesystem, Unix-socket, GCC-link, and ELF semantics and has no Darwin adapter."
