build_command = "make check CC=<ccc-adapter> DEBUGLEVEL=2 ZSTD_NO_ASM=1 HAVE_PTHREAD=1 HAVE_ZLIB=0 HAVE_LZMA=0 HAVE_LZ4=0"
test_profile = "upstream-quick-smoke"
test_command = "make check"
success_marker = "All tests completed successfully"
target_compiler = "ccc"
link_driver = "gcc"
link_mode = "platform-default-pie-executable"
optional_format_libraries = "disabled"
assembly = "standalone-disabled-certified-inline-enabled"
selected_inline_assembly_statements = 18
threading = "enabled-pthread"
unaligned_memory_access = "upstream-aligned-1-scalar-typedefs"
zstd_memory_access_selection = "upstream-default-1"
xxhash_memory_access_selection = "upstream-default-1"
memory_access_overrides = "forbidden"
