portable_assert_contract = "glibc-standard-c-macro"

target = "x86_64-unknown-linux-gnu"
language_mode = "gnu11"
gnu_compatibility_tuple = "4.2.1"
build_interface = "upstream-make"
build_target = "check"
build_command = "make check CC=<ccc-adapter> DEBUGLEVEL=2 ZSTD_NO_ASM=1 MEM_FORCE_MEMORY_ACCESS=0 XXH_FORCE_MEMORY_ACCESS=0 MOREFLAGS='-I<compat-include> -include <libc-memory-deps.h>' HAVE_PTHREAD=1 HAVE_ZLIB=0 HAVE_LZMA=0 HAVE_LZ4=0"
test_profile = "upstream-quick-smoke"
test_command = "make check"
success_marker = "All tests completed successfully"
target_compiler = "ccc"
link_driver = "gcc"
link_mode = "non-pie-executable"
optional_format_libraries = "disabled"
assembly = "disabled"
threading = "enabled-pthread"
unaligned_memory_access = "upstream-memcpy-fallbacks"
source_translation_occurrences = 50
generated_pthread_probe_translation_occurrences = 2
generated_pthread_probe_sha256 = "ec0d733a96cf302e7a028680433e75663e240ea080c0a46e68b19b30c8cf9387"
native_link_commands = 4
generated_pthread_probe_link_commands = 2

