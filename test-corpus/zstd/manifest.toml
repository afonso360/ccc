license = "BSD-3-Clause OR GPL-2.0-only"
upstream_license_files = ["LICENSE", "COPYING"]
fetched_not_vendored = true

source_adjustment_patch = "no-asm-generic-paths.patch"
source_adjustment_sha256 = "dfbe4f3063bc40ef0a66763f5110f24c666db82ca4aa5ddfdb612788e9c66fee"
source_adjustment_hashes = "no-asm-generic-paths.sha256"
source_adjustment_hashes_sha256 = "9199e41a4c47b9a1f02fb4d117ad41fabbbdba821247e8ded6125b990c0460f4"
source_adjustment_target_files = 7
source_adjustment_rationale = "The upstream no-assembly configuration excludes stand-alone assembly but leaves performance-only GNU inline assembly and count-bit builtins selected by compiler identity. The adjustment extends that configuration to the existing generic C fallbacks without changing the compression format, public API, or tested behavior."
dependency_override = "libc-memory-deps.h"
dependency_override_sha256 = "e860784721b0c5823d62b3a37e77b73ffe046f65473fda4dc70e7a9b58cd062b"
dependency_override_contract = "ZSTD_DEPS_COMMON"
