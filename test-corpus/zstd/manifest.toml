source_adjustment_rationale = "The upstream no-assembly configuration excludes stand-alone assembly but leaves performance-only GNU inline assembly selected by compiler identity. The adjustment extends that configuration to the existing generic C fallbacks without changing the compression format, public API, or tested behavior."

target = "x86_64-unknown-linux-gnu"
